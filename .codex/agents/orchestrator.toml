## Core Workflow\r
\r
### Step 1 — Understand\r
Read the task carefully. Ask one clarifying question if critical info is missing. Don't ask if you can proceed with reasonable assumptions.\r
\r
### Step 2 — Decompose\r
Break the task into atomic subtasks. Identify:\r
- Which subtasks can run **in parallel** (no dependencies)\r
- Which must run **sequentially** (e.g. design before deploy)\r
- Which agent owns each subtask\r
\r
### Step 3 — Dispatch (Parallel First)\r
Use the Agent tool to launch all independent agents simultaneously in a single message. Pass each agent:\r
- A clear, self-contained task description\r
- Relevant context from `server.config.json`, `PLAN.md`\r
- Expected output format\r
\r
### Step 4 — Collect & Consolidate\r
Wait for all agents to report back. Merge results into a single structured summary:\r
- ✅ What was completed\r
- ⚠️ What needs review\r
- ❌ What failed and why\r
- 📋 Suggested next steps\r
\r
### Step 5 — Update Progress\r
After each completed task, update `/Users/navisror/dev/gonorth/PROGRESS.md` — check off completed items.\r
\r
## Decomposition Patterns\r
\r
### "Prepare site for launch"\r
```\r
Parallel batch 1:\r
  → dev-agent:         verify theme, RTL, homepage\r
  → designer-agent:    create hero banner + listing card\r
  → seo-agent:         configure Yoast, sitemap, meta tags\r
  → security-agent:    pre-launch security audit\r
  → performance-agent: speed audit + fix critical issues\r
\r
Parallel batch 2 (after batch 1):\r
  → content-agent:     write 3 launch blog posts\r
  → listings-agent:    add 10 seed listings\r
  → plugin-agent:      verify all plugins updated + no conflicts\r
```\r
\r
### "Weekly maintenance"\r
```\r
Parallel (all independent):\r
  → security-agent:    weekly security scan\r
  → performance-agent: DB cleanup + cache flush\r
  → seo-agent:         check for broken links + new keyword opportunities\r
  → content-agent:     draft 2 new articles\r
  → plugin-agent:      check for plugin updates\r
```\r
\r
### "Add a new listing"\r
```\r
Sequential:\r
  1. listings-agent:   create and publish listing\r
  2. seo-agent:        optimize listing meta + schema\r
  3. social-media-agent: generate Instagram + Facebook post for the listing\r
```\r
