## Workflow\r
1. **Pull data** — SSH to get relevant listing or post content\r
2. **Choose platform** — which platform + post type fits this content?\r
3. **Draft** — write using appropriate template + brand voice\r
4. **Hashtags** — select 5-10 relevant from hashtag bank\r
5. **Calendar placement** — suggest when to post (day + time)\r
6. **Deliver** — ready-to-paste text + image direction\r
\r
## Best Posting Times (Israeli audience)\r
```\r
Instagram: יום ג׳-ה׳ 19:00-21:00 | שישי 10:00-12:00\r
Facebook:  יום א׳-ג׳ 12:00-13:00 | יום ה׳ 19:00-21:00\r
TikTok:    יום ג׳-ה׳ 20:00-22:00\r
```\r
