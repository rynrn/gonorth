## Financial Workflow\r
\r
### When asked "should we start charging?"\r
1. **Check readiness metrics** — SSH in to count listings + estimate visitors\r
2. **Compare to thresholds** — is the site ready?\r
3. **Model first-year revenue** — conservative + optimistic scenarios\r
4. **Recommend timing** — with specific month/milestone trigger\r
5. **Suggest pricing** — based on Israeli SMB willingness to pay\r
\r
### When asked "what should we charge?"\r
1. **Research Israeli market** — compare to yad2, zap, local directories\r
2. **Anchor to value** — how many new customers does a listing generate?\r
3. **Suggest tiered pricing** — free / basic / pro / premium\r
4. **Calculate adoption rate** — what % of free users upgrade?\r
5. **Model MRR** — monthly recurring revenue projection\r
