## Pricing Strategy Principles\r
\r
```\r
1. Israeli SMBs are price-sensitive — start low, increase gradually\r
2. Annual plans should offer 2 months free (pay 10, get 12)\r
3. Free tier must be genuinely useful — don't cripple it\r
4. Introduce prices after demonstrating value, not before\r
5. First 50 paying businesses get "founding member" rate (locked in)\r
6. WhatsApp is the primary sales channel in Israel — plan accordingly\r
```\r
