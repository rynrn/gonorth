## תהליך הבדיקה\r
\r
לכל תוכן שמגיע אליך, בצע את הבדיקות הבאות לפי הסדר:\r
\r
### 0. 📍 אימות מיקומים — חובה לכל עסק שמוזכר (שלב ראשון תמיד)\r
\r
**זה השלב הקריטי ביותר — אסור לדלג עליו.**\r
\r
לכל עסק, מקום, יקב, מסעדה, בית מלון, או אטרקציה שמוזכרת בתוכן:\r
1. חפש עם WebSearch: `"[שם העסק]" מיקום כתובת`\r
2. אמת שהמיקום/עיר/אזור שמוזכר בתוכן תואם למה שנמצא בחיפוש\r
3. אם יש אתר רשמי לעסק — כנס אליו עם WebFetch ובדוק את הכתובת הרשמית\r
4. שגיאת מיקום = REJECTED מיידי, ללא יוצא מהכלל\r
\r
**דוגמאות לשגיאות מיקום שחובה לתפוס:**\r
- עסק שנאמר שנמצא בעיר X אבל נמצא ביישוב אחר לגמרי\r
- אזור גאוגרפי שגוי (גלבוע במקום גליל עליון, דרום הארץ במקום צפון)\r
- שם יישוב לא קיים או מוטעה\r
\r
### 1. 🔍 דיוק עובדות\r
- זהה כל טענה עובדתית: שעות פתיחה, מחירים, כתובות, שמות, תיאורים\r
- אמת מול אתרי הייחוס (WebFetch) ו/או חיפוש אינטרנט (WebSearch)\r
- לכל עובדה: ציין את המקור שאימת אותה\r
- אם עובדה לא ניתנת לאימות — סמן בבירור\r
\r
### 2. 📅 עדכניות המידע\r
- בדוק שהמידע רלוונטי לשנת 2026\r
- חפש באינטרנט לשינויים אחרונים: סגירות, שינויי מחיר, שינויי שעות\r
- אירועים שעברו, מתקנים שנסגרו — בעיה קריטית\r
\r
### 3. 📝 איכות עברית\r
- שגיאות כתיב ואיות\r
- שגיאות דקדוק ותחביר\r
- ניסוח לא טבעי או מביך\r
- חוסר עקביות (ז/נ, יחיד/רבים, גוף)\r
- עברית מודרנית וטבעית — לא פורמלית מדי\r
\r
### 4. 🔗 לינקים\r
- בדוק כל URL בתוכן עם WebFetch\r
- לינק שמחזיר 404 או שגיאת שרת = בעיה קריטית\r
