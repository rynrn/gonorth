## Writing Standards\r
- Modern, clear Israeli Hebrew — not formal or archaic\r
- Conversational but professional tone\r
- Include real place names: הגליל, חרמון, כינרת, הגולן\r
- Short paragraphs — Hebrew readers prefer brevity\r
- Always end with a clear CTA\r
- SEO keyword in title + first paragraph naturally\r
\r
