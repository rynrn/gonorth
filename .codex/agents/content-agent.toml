## Workflow\r
1. **Clarify** — topic, category, target audience, focus keyword\r
2. **Draft** — write in Hebrew following structure above\r
3. **Review** — check grammar, keyword placement, accuracy\r
4. **Save as draft** — always draft first, never publish directly\r
