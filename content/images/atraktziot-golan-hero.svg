<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="אטרקציות ברמת הגולן — מבצר נמרוד, מפל הבניאס והר החרמון">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="55%" stop-color="#9FE3F0"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <linearGradient id="hermon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e8070"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <linearGradient id="hillsFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="hillsNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8fbff"/>
      <stop offset="100%" stop-color="#48CAE4"/>
    </linearGradient>
    <linearGradient id="rowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4226"/>
      <stop offset="100%" stop-color="#4a2e1a"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a3a2a" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="980" cy="150" r="120" fill="#E9C46A" opacity="0.35"/>
  <circle cx="980" cy="150" r="60" fill="#E9C46A" opacity="0.6"/>

  <!-- Mount Hermon range, snow-capped -->
  <path d="M -20 300 L 220 120 L 300 190 L 430 90 L 560 260 L 700 200 L 900 320 L 1220 260 L 1220 630 L -20 630 Z" fill="url(#hermon)"/>
  <path d="M 220 120 L 260 150 L 190 170 Z" fill="#F8F5F0" opacity="0.9"/>
  <path d="M 430 90 L 470 130 L 395 145 Z" fill="#F8F5F0" opacity="0.9"/>

  <!-- Nimrod Fortress silhouette on a ridge -->
  <g transform="translate(150,255)">
    <path d="M0 60 L20 60 L20 30 L35 30 L35 45 L55 45 L55 20 L70 20 L70 45 L95 45 L95 15 L110 15 L110 45 L140 45 L140 60 L160 60 L160 75 L0 75 Z" fill="#1a2e1e"/>
    <rect x="15" y="18" width="10" height="14" fill="#1a2e1e"/>
    <rect x="88" y="6" width="10" height="12" fill="#1a2e1e"/>
  </g>

  <!-- far hills -->
  <path d="M -20 360 Q 250 300 500 360 T 1220 350 L 1220 630 L -20 630 Z" fill="url(#hillsFar)" opacity="0.9"/>

  <!-- eagle -->
  <g transform="translate(760,150)" fill="#1a2e1e" opacity="0.85">
    <path d="M0 6 C -18 -10 -42 -12 -62 -2 C -44 4 -28 10 -14 16 C -30 14 -46 18 -60 28 C -40 26 -22 24 0 18 C 22 24 40 26 60 28 C 46 18 30 14 14 16 C 28 10 44 4 62 -2 C 42 -12 18 -10 0 6 Z"/>
  </g>

  <!-- near hills -->
  <path d="M -20 420 Q 300 350 620 420 T 1220 400 L 1220 630 L -20 630 Z" fill="url(#hillsNear)"/>

  <!-- vineyard rows (Golan Heights Winery) -->
  <g opacity="0.85">
    <path d="M60 560 L 260 470" stroke="url(#rowGrad)" stroke-width="6"/>
    <path d="M90 575 L 300 480" stroke="url(#rowGrad)" stroke-width="6"/>
    <path d="M120 590 L 340 492" stroke="url(#rowGrad)" stroke-width="6"/>
    <path d="M150 605 L 380 505" stroke="url(#rowGrad)" stroke-width="6"/>
    <path d="M180 618 L 420 518" stroke="url(#rowGrad)" stroke-width="6"/>
  </g>

  <!-- waterfall (Banias / Gamla) -->
  <g>
    <path d="M900 350 C 895 400 905 430 898 470 C 892 500 908 520 900 560 L 950 560 C 958 520 942 500 948 470 C 955 430 945 400 950 350 Z" fill="url(#water)"/>
    <ellipse cx="925" cy="565" rx="70" ry="18" fill="#e8fbff" opacity="0.9"/>
    <ellipse cx="925" cy="565" rx="46" ry="10" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- foreground water pool -->
  <path d="M -20 590 Q 500 540 1220 585 L 1220 630 L -20 630 Z" fill="#48CAE4" opacity="0.5"/>

  <!-- vignette for text contrast -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- title card -->
  <g>
    <rect x="70" y="470" width="620" height="120" rx="16" fill="#1a3a2a" opacity="0.55"/>
    <text x="660" y="520" font-family="Heebo, Assistant, Arial, sans-serif" font-size="46" font-weight="800" fill="#F8F5F0" text-anchor="end" direction="rtl">אטרקציות ברמת הגולן</text>
    <text x="660" y="562" font-family="Heebo, Assistant, Arial, sans-serif" font-size="24" font-weight="500" fill="#E9C46A" text-anchor="end" direction="rtl">8 אתרים שחייבים לראות — GoNorth</text>
  </g>
</svg>
